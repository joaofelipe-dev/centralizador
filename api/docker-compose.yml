services:
  db:
    image: postgres:16-alpine
    container_name: centralizador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: centralizador
      POSTGRES_PASSWORD: centralizador
      POSTGRES_DB: centralizador
    ports:
      - "5432:5432"
    volumes:
      - centralizador_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centralizador -d centralizador"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  centralizador_db_data:
